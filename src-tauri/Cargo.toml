[package]
name = "roomit"
version = "0.2.0"
description = "Roomit desktop workspace inspector"
license.workspace = true
edition = "2024"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roomit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
roomit-core = { path = "../crates/roomit-core" }
tauri-plugin-dialog = "2"
sysinfo = { version = "0.37", default-features = false, features = ["disk", "system", "network"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-opener = { version = "2", default-features = false }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
tempfile = "3"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security", "Win32_System_Performance"] }

[target.'cfg(target_os = "macos")'.dependencies]
notify = "8.2"
