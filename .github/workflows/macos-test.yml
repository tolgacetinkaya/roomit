name: Apple Silicon test package

on:
  push:
    branches: [feat/macos-apple-silicon]
  pull_request:
    paths:
      - '.github/workflows/macos-test.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'scripts/package-macos.sh'
      - 'Cargo.*'
      - 'package*.json'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-silicon:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Native Apple Silicon toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin
      - run: npm ci
      - name: Frontend and native tests
        run: |
          npm run build
          npm test
          cargo test -p roomit-core --locked
          cargo test -p roomit --lib --locked
      - name: Build ad-hoc signed app and DMG
        run: npm run tauri -- build --ci --target aarch64-apple-darwin --config src-tauri/tauri.macos-test.conf.json --bundles app,dmg
      - name: Verify and package
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Roomit-macos-arm64-test
          path: artifacts/macos-test/
          if-no-files-found: error
          retention-days: 30
